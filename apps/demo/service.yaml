apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: ClusterIP
  selector:
    app: demo
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo
  namespace: default
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
