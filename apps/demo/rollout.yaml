apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 4
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: demo

  strategy:
    canary:
      canaryService: demo-canary
      stableService: demo-stable

      steps:
        - setWeight: 25
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: demo-error-rate

        - setWeight: 50
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: demo-error-rate

        - setWeight: 100

  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: enterprise-demo
          image: juliet237/enterprise-demo:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
